# Mike Xiangyu Liu — al-folio v1.2
title: blank
first_name: Mike
middle_name: Xiangyu
last_name: Liu
description: >-
  Robotics research by Mike Xiangyu Liu: collaborative SLAM,
  distributed optimization, and dense 3D reconstruction.
keywords: robotics, SLAM, multi-robot systems, pose graph optimization, 3D reconstruction
lang: en
icon: "🤖"
url: https://mikexyl.github.io
baseurl: ""
repository: mikexyl/mikexyl.github.io
timezone: Asia/Nicosia
footer_text: >-
  Built with <a href="https://github.com/alshedivat/al-folio">al-folio</a>.
  Hosted on <a href="https://pages.github.com/">GitHub Pages</a>.
cv_url: https://drive.google.com/file/d/12-vMRZpLLHKk7fQvez_pARRcutQIrjLc/view?usp=sharing
email: xl142@illinois.edu
github_username: mikexyl

theme: al_folio_core
al_folio:
  api_version: 1
  style_engine: tailwind
  tailwind:
    version: 4.1.18
    preflight: false
    css_entry: assets/tailwind/app.css
  distill:
    engine: distillpub-template
    source: al-org-dev/distill-template#al-folio
    allow_remote_loader: false
  features:
    cv:
      enabled: false
    distill:
      enabled: false
  compat:
    bootstrap:
      enabled: false
  upgrade:
    channel: stable
    auto_apply_safe_fixes: false

navbar_fixed: true
footer_fixed: false
max_width: 1080px
last_updated: false
back_to_top: false
search_enabled: false
bib_search: false
enable_darkmode: true
enable_navbar_social: false
enable_project_categories: false
enable_masonry: false
enable_progressbar: false
enable_math: false
enable_medium_zoom: false
enable_cookie_consent: false
enable_video_embedding: false
enable_publication_thumbnails: true
enable_publication_badges:
  altmetric: false
  dimensions: false
  google_scholar: false
  inspirehep: false
serve_og_meta: true
serve_schema_org: true
og_image: /projects/code-slam/code_slam_teaser.png

include: [_pages]
exclude:
  - vendor
  - node_modules
  - scripts
  - Gemfile
  - Gemfile.lock
  - package.json
  - package-lock.json
  - README.md
  - LICENSE
  - CHANGELOG.md
  - CONTRIBUTING.md
  - docker-compose.yml
  - markdown_generator
  - talkmap
  - talkmap.py
  - talkmap.ipynb
  - .al-folio-overrides.yml
  - al-folio-upgrade-report.md
keep_files: [CNAME, .nojekyll]
collections:
  projects:
    output: true
    permalink: /projects/:path/
defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: research
  - scope:
      path: assets
    values:
      sitemap: false

markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter_opts:
    css_class: highlight
sass:
  style: compressed
imagemagick:
  enabled: false
lazy_loading_images: true
plugins:
  - jekyll-3rd-party-libraries
  - jekyll-cache-bust
  - jekyll-feed
  - jekyll-link-attributes
  - jekyll-redirect-from
  - jekyll-regex-replace
  - jekyll/scholar
  - jekyll-sitemap
  - jekyll-socials
  - al_folio_core
  - al_icons
  - al_citations
  - al_folio_upgrade
scholar:
  last_name: [Liu]
  first_name: [Xiangyu, Mike Xiangyu]
  style: ieee
  locale: en
  source: /_bibliography/
  bibliography: papers.bib
  bibliography_template: bib
  bibtex_filters: [latex, smallcaps, superscript]
  replace_strings: true
  join_strings: true
  query: "@*"
  group_by: year
  group_order: descending
max_author_limit: 10
more_authors_animation_delay: 10
filtered_bibtex_keywords: [abbr, abstract, award, award_name, bibtex_show, code, pdf, preview, selected, video, website]
external_links:
  enabled: true
  rel: external noopener
  target: _blank

# Library URLs and integrity hashes from al-folio v1.2.
third_party_libraries:
  download: false
  fontawesome:
    integrity:
      css: sha256-MVopmdyC2tYTiJ8wlktf0uh0v4NgT+vNdyVFepi7Q0c=
    url:
      css: https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@{{version}}/css/all.min.css
    version: 7.2.0
  academicons:
    integrity:
      css: sha256-SzrCOBJbGVFMahewkgjwnApaV2+av1DwMAA+/QGLyZw=
    url:
      css: https://cdn.jsdelivr.net/npm/academicons@{{version}}/css/academicons.min.css
    version: 1.9.5
  google_fonts:
    url:
      fonts: https://fonts.googleapis.com/css?family=Roboto:300,400,500,700|Roboto+Slab:100,300,400,500,700|Material+Icons&display=swap
